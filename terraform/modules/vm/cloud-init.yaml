#cloud-config
# Runs ONCE on the VM's first boot.
# Installs Docker Engine (CE) and the Docker Compose v2 plugin,
# adds the admin user to the docker group so sudo is not needed,
# and creates a working directory for the compose files.

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

runcmd:
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${admin_username}
  - systemctl enable docker
  - systemctl start docker
  - mkdir -p /opt/portfolio
  - chown ${admin_username}:${admin_username} /opt/portfolio
  - echo "${acr_login_server}" > /opt/portfolio/.acr_login_server

final_message: "Cloud-init complete. Docker is installed and ready."
